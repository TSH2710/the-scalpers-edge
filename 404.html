<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    :root {
      --bg: #fafafa;

      --border: #e5e5e5;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 0.5rem; }
    p { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 2rem; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 0.8rem 1.75rem;
      background: var(--text);
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    a:hover { opacity: 0.8; }

</head>
<body>
  <div class="container">

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@scalpersedge — X profile preview</title>
<style>
  body { background:#000; font-family:'Segoe UI', -apple-system, sans-serif; margin:0; padding:2rem; display:flex; justify-content:center; }
  .phone { width:600px; background:#000; color:#e7e9ea; border:1px solid #2f3336; border-radius:16px; overflow:hidden; }
  .banner { width:100%; display:block; aspect-ratio:3/1; object-fit:cover; }
  .avatar { width:128px; height:128px; border-radius:50%; border:4px solid #000; margin:-70px 0 0 16px; position:relative; }
  .handle { padding:8px 16px 0; font-size:15px; }
  .handle .n { font-weight:800; font-size:20px; color:#e7e9ea; }
  .handle .h, .stat { color:#71767b; }
  .bio { padding:12px 16px 4px; font-size:15px; line-height:1.45; white-space:pre-line; }
  .meta { padding:12px 16px 20px; display:flex; gap:20px; font-size:13px; }
  .meta b { color:#e7e9ea; }
  .label { background:#000; color:#71767b; font-size:12px; padding:8px 16px; }
</style>
</head>
<body>
<div>
  <p class="label">How it will look on X (desktop ≈ crops ~40px top/bottom of banner):</p>
  <div class="phone">
    <img class="banner" src="banner-1500x500.png" alt="banner">
    <img class="avatar" src="avatar-400.png" alt="avatar">
    <div class="handle"><div class="n">The Scalper's Edge</div><div class="h">@scalpersedge</div></div>
    <div class="bio" id="bio"></div>
    <div class="meta">
      <span class="stat"><b>0</b> Following</span>
      <span class="stat"><b>0</b> Followers</span>
      <span class="stat">📍 <span id="loc"></span></span>
    </div>
  </div>
</div>
<script>
  document.getElementById('bio').textContent = [
    "Trade smarter. Journal harder.",
    "",
    "Notion trade journal built for scalpers — R-multiples, spread costs, session heatmaps, psychology flags.",
    "",
    "Free lite + full template ↓"
  ].join("\n");
  document.getElementById('loc').textContent = "thescalpersedge.com";
</script>
</body>
</html>

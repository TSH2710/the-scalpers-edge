<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- @scalpersedge avatar — renders to 400x400. Light editorial brand: #fafafa, black bolt. -->
  <rect width="800" height="800" fill="#fafafa"/>
  <!-- subtle film grain, same treatment as the site -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="800" height="800" filter="url(#grain)" opacity="0.035"/>
  <!-- the hand-drawn lightning bolt from the site nav, centered -->
  <g transform="translate(400,400) scale(22) translate(-7,-9)">
    <path d="M8 1L1 10h5.5L5 17l8-9H7L8 1z" fill="#111111"/>
  </g>
</svg>
